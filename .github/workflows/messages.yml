# Hourly: queue due reminders and send emails, even when the owner's phone is off.
# Needs repository secrets APP_URL (e.g. https://app.woofersdogspa.com) and CRON_SECRET.
name: messages
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set yet, skipping"; exit 0; fi
          curl -fsS --retry 3 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/messages"
